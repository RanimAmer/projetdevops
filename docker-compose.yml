services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: "db"
      MYSQL_USER: "root"
      MYSQL_PASSWORD: "root"
      MYSQL_ROOT_PASSWORD: "root"  # Password matching your application.properties
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  tp-foyer:
    image: caeser9/tp-foyer:1.0.0  # Replace with your Docker image name and tag
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/db?createDatabaseIfNotExist=true"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "root"
      SERVER_PORT: 8089
      SERVER_SERVLET_CONTEXT_PATH: "/tpfoyer"
    ports:
      - "8089:8089"
    depends_on:
      - mysql
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"  # Expose Prometheus web UI on 9091

    grafana:
      image: grafana/grafana:latest
      ports:
        - "3001:3000"  # Expose Grafana web UI on port 3000
      depends_on:
        - prometheus
volumes:
  mysql_data:
