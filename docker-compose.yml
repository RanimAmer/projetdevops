version: '3.8'

services:
  mysqldb:
    container_name: mysqldb
    image: mysql:5.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD:
      MYSQL_DATABASE: ranim
    ports:

      - "3307:3306"
    volumes:
      - db:/var/lib/mysql
    networks:
      - mynetwork

  backend:
    container_name: backend
    image: ranim1707/tp-foyer:5.0.0
    restart: on-failure
    ports:
      - "8089:8089"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysqldb:3306/ranim"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: ""
      SERVER_PORT: 8089
      SERVER_SERVLET_CONTEXT_PATH: "/tpfoyer"


    depends_on:
      - mysqldb
    stdin_open: true
    tty: true
    networks:
      - mynetwork

volumes:
  db:
networks:
  mynetwork:
    driver: bridge