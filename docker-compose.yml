services:
  tp-foyer-app:
    image: houssem167/tp-foyer-backend:latest
    container_name: tp-foyer-app-container
    ports:
      - "8089:8089"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ''
      SPRING_JPA_SHOW_SQL: 'true'
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - db  # Fixed space issue here

  db:
    image: mysql:8.0
    container_name: mysql-container
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ''
      MYSQL_DATABASE: db
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:

