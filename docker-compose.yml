services:
  mysqldb:
    image: mysql:5.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ''
      MYSQL_DATABASE: db
    ports:
      - "3307:3306"
    volumes:
      - db:/var/lib/mysql
    networks:
      - mynetwork

  backend:
    networks:
      - mynetwork
    depends_on:
      - mysqldb
    image: houssem167/tp-foyer-backend:latest# Votre image backend Spring
    restart: on-failure
    ports:
      - "8087:8089"
    environment:
      SPRING_APPLICATION_JSON: '{ "spring.datasource.url"  : "jdbc:mysql://mysqldb:3306/db?createDatabaseIfNotExist=true", "spring.datasource.username" : "root", "spring.datasource.password" : "root", "spring.jpa.properties.hibernate.dialect" : "org.hibernate.dialect.MySQL8Dialect", "spring.jpa.hibernate.ddl-auto" : "update"}'
    stdin_open: true
    tty: true
