services:
  mysqldb:
    container_name: mysqldb
    image: mysql:5.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db
    ports:
      - "3307:3306"
    volumes:
      - db:/var/lib/mysql
    networks:
      - mynetwork


  backend:
    container_name: backend
    image: ghofranefaj/tp-foyer:5.0.0
    restart: on-failure
    ports:
      - "8088:8089"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysqldb:3306/db?createDatabaseIfNotExist=true"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "root"
      SERVER_PORT: 8089
      SERVER_SERVLET_CONTEXT_PATH: "/tpfoyer"
    depends_on:
      - mysqldb
    stdin_open: true
    tty: true
    networks:
      - mynetwork
  frontend:
    build:
      context: "DevopsFrontend/DevopsFront" # Assurez-vous que cela correspond à l'emplacement de votre Dockerfile
      dockerfile: Dockerfile # Assurez-vous que cela correspond au nom de votre Dockerfile
    image: ghofranefaj/angular-frontend:latest # Votre image frontend Angular
    ports:
      - "4200:80" # Exposez le frontend sur le port 80
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - mynetwork
    environment:
      - API_URL=http://backend:8088/tpfoyer/etudiant/

volumes:
  db:

networks:
  mynetwork:
    driver: bridge
